name: Uriregistry backend tests

on:
  workflow_dispatch:

  pull_request:
    paths:
      - uriregistry/**
      - .github/workflows/uriregistry.yaml
      - scripts/**
      - pyproject.toml
      - requirements*.txt
      - tests/**

  push:
    branches:
      - master

permissions: {}

jobs:
  test:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-tests.yml@v1
    permissions:
      contents: read
      pull-requests: write # coverage comment
    with:
      runs-on: ubuntu-latest # public repo: no self-hosted runners
      requirements-file: requirements-dev.txt
      lint-command: "" # the old workflow ran no linter
      test-command: pytest tests --cov=uriregistry --cov-report=xml:"$COVERAGE_XML" --capture=no -vvv
      coverage-threshold-new: 0 # the old workflow didn't set it
